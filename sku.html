<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>

    <!--PyScript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body style="background-color: burlywood; min-height: 100vh; display: flex; flex-direction: column; margin: 0;">
    <nav class="navbar navbar-inverse navbar-fixed-top">
        <div class="container-fluid bg-light m-2 p-4 rounded" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">Egg Store</a>
            </div>
            <ul class="nav navbar-nav">
                <li class="active"><a href="index.html">Receipt Generator</a></li>
                <li><a href="#">SKU Generator</a></li>
            </ul>
        </div>
    </nav>
    <div class="container m-3 p-4 rounded" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: bisque;">
        <h1>Egg Store SKU Generator</h1><br>
        <label for="quantity">Quantity</label>
        <select name="quantity" id="quantity">
            <option value="P8">8 pieces</option>
            <option value="P12">12 pieces</option>
        </select><br><br>
        <label for="size">Size</label>
        <select name="size" id="size">
            <option value="SML">Small</option>
            <option value="MED">Medium</option>
            <option value="LRG">Large</option>
        </select><br><br>
        <button py-click="generate_sku" class="btn btn-success">Generate SKU</button><br><br>
        <div class="bg-light m-3 p-3 rounded">
            <h5>GENERATED SKU</h5>
            <div id="result">

            </div>
        </div>
    </div>
    <footer style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
        <div class="container bg-light m-3 p-3 rounded">
            &copy; 2026. All rights reserved.
        </div>
    </footer>
    <py-script src="main.py"></py-script>
</body>
</html>
